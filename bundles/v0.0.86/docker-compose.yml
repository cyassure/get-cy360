# CyAssure 360 — deployment bundle (v0.0.86)
# You need only this file + .env. There is no source code, Dockerfile, or
# build context anywhere in this bundle.
#
#   docker compose up -d      start everything
#   docker compose down       stop everything (add -v to also wipe the DB)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: correlation
      POSTGRES_USER: corruser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - cy360_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corruser -d correlation"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - cy360_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/cyassure/cy360-backend:${CYASSURE_VERSION:-0.0.86}
    restart: unless-stopped
    environment:
      CYASSURE_DB_URL: postgresql://corruser:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/correlation
      REDIS_URL: redis://redis:6379/0
      SIEM_ENGINE_URL: http://cysiemstack-engine:8100
      # CyDataLake raw-log bus — see docs/CYDATALAKE_BUILDOUT_PLAN.md. Bundled
      # by default now; CYDATALAKE_ENABLED (single flag) defaults false, so
      # this is inert until you opt in via Settings > CyDataLake.
      CYDATALAKE_BROKER_URL: redpanda:9092
      CYDATALAKE_DB_HOST: clickhouse
      CYDATALAKE_DB_PORT: "8123"
      CYDATALAKE_DB_NAME: cydatalake
      CYDATALAKE_DB_USER: default
      CYDATALAKE_DB_PASSWORD: ${CYDATALAKE_DB_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # Backend itself never binds to APP_PORT (only the frontend service's
      # port mapping does) — passed through anyway so core/config.py's
      # localhost fallback (used only when BASE_DOMAIN is also unset) reports
      # the port the stack is actually reachable at, not a hardcoded 8080.
      APP_PORT: ${APP_PORT:-8080}
      # FRONTEND_URL/BASE_URL deliberately have NO entry here (not even a
      # ${FRONTEND_URL:-} one — that would still set the container's env var
      # to an explicit empty string, which os.environ.get() treats as
      # "present", permanently hiding core/config.py's own fallback behind
      # it). They used to hardcode http://localhost:${APP_PORT} here, which
      # always won the env_file/environment merge over config.py's own
      # https://${BASE_DOMAIN} default — even when the admin had already set
      # a real BASE_DOMAIN via Settings -> Organization Domain / the Setup
      # Wizard (both write only BASE_DOMAIN, never these two vars) — so every
      # install/link/Quick-Deploy URL silently came out http:// instead of
      # https://. Left unset, they're only set at all if env_file's ./.env
      # explicitly defines them (e.g. a non-standard reverse-proxy port
      # BASE_DOMAIN alone can't describe), else fall through to config.py's
      # own BASE_DOMAIN-aware default.
      # OpenVAS/GVM — only reached for Deep-tier ASM scans, and only if the
      # separate, opt-in docker-compose.gvm.yml stack is running too. Defaults
      # OFF. See that file's header comment for what it is and why it's kept
      # this heavily gated (real active network vuln scanning, materially
      # heavier than everything else this platform runs by default).
      ENABLE_OPENVAS: ${ENABLE_OPENVAS:-false}
      GVM_USER: ${GVM_USER:-}
      GVM_PASSWORD: ${GVM_PASSWORD:-}
      # Self-update: talks to the updater sidecar over the compose network.
      # If the "selfupdate" profile isn't active there's simply nothing
      # listening at this address — the backend handles that as a clear
      # "self-update not enabled" response rather than an error.
      UPDATER_URL: http://updater:8099
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/cyassure:/opt/cyassure
      # ASM scan history (scan JSON/reports/engine log) — absolute host bind
      # mount so it survives `docker compose pull && up -d` upgrades instead
      # of being wiped with the recreated container's writable layer.
      - /var/log/cyassure:/var/log/cyassure
      # Read-write: docker-entrypoint.sh (baked into the backend image) writes
      # cyassure.yar/sysmon config/agent scripts/installer binaries here on
      # every container start, so a plain `docker compose pull && up -d`
      # picks up fixes to any of them automatically — no manual staging.
      - /var/lib/cyassure-agent-packages:/var/lib/cyassure-agent-packages
      # Settings > Environment Config "Global (.env)" tab and the Setup
      # Wizard read/write THIS project's real .env. Single-FILE mount only
      # (not the whole project dir) — this container is internet-facing and
      # has no reason to read anything else in the project directory.
      # Plain ./.env (not ${COMPOSE_PROJECT_DIR}) — Compose resolves this
      # relative to the compose file's own directory, same as env_file:
      # below, so it can never drift from the real .env the way a
      # once-baked-at-install-time absolute variable can if this directory
      # is ever moved/restored elsewhere. See docker-compose.yml's matching
      # comment for the full incident this avoids.
      - ./.env:/project/.env
      # gvmd's Unix socket — safe to always mount (empty host dir if the
      # optional GVM stack isn't running; run_openvas_scan() no-ops
      # gracefully). See docker-compose.gvm.yml's header comment.
      - /opt/cyassure/gvm-socket:/run/gvmd:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5252/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  cysiemstack-engine:
    image: ghcr.io/cyassure/cy360-engine:${CYASSURE_VERSION:-0.0.86}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://corruser:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/correlation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/cyassure:/opt/cyassure
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    image: ghcr.io/cyassure/cy360-frontend:${CYASSURE_VERSION:-0.0.86}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      cysiemstack-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # ── CyDataLake — raw multi-vendor log bus + hot store ──────────────────────
  # See docs/CYDATALAKE_BUILDOUT_PLAN.md for the full phased build-out. Part
  # of the default stack now (no separate install); toggle via Settings ->
  # CyDataLake in the UI (CYDATALAKE_ENABLED, single flag). No published
  # ports on either.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --default-log-level=info
    restart: unless-stopped
    volumes:
      - cy360_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.1
    restart: unless-stopped
    environment:
      # These three keys are the upstream clickhouse-server image's OWN
      # bootstrap env vars — not renameable. Only the .env source var on the
      # right is part of the CyDataLake rebrand.
      CLICKHOUSE_DB: cydatalake
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CYDATALAKE_DB_PASSWORD:?set CYDATALAKE_DB_PASSWORD in .env}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - cy360_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Reuses the backend image (kafka-python/clickhouse-connect/pyarrow are
  # already in its requirements.txt, and cysiemstack/ingest_worker.py is
  # already baked in, shipped as ingest_worker.pyc like every other module in
  # this image — see backend/Dockerfile) instead of a 5th custom image.
  ingest-worker:
    image: ghcr.io/cyassure/cy360-backend:${CYASSURE_VERSION:-0.0.86}
    command: ["python", "cysiemstack/ingest_worker.pyc"]
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CYDATALAKE_BROKER_URL: redpanda:9092
      CYDATALAKE_DB_HOST: clickhouse
      CYDATALAKE_DB_PORT: "8123"
      CYDATALAKE_DB_NAME: cydatalake
      CYDATALAKE_DB_USER: default
      CYDATALAKE_DB_PASSWORD: ${CYDATALAKE_DB_PASSWORD:?set CYDATALAKE_DB_PASSWORD in .env}
    env_file:
      - path: ./.env
        required: false
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - cy360_cydatalake_archive:/var/lib/cyassure/cydatalake-archive
    # Inherited backend-image HEALTHCHECK (curl :5252/health) doesn't apply —
    # this container runs the ingest worker, not gunicorn, so nothing listens
    # on 5252. Confirmed live: without this it flips permanently unhealthy.
    healthcheck:
      disable: true

  # Self-update sidecar (ON BY DEFAULT — see README.md "Self-update"). Gated
  # by COMPOSE_PROFILES=selfupdate, which .env.example sets ON by default.
  # Grants this one container Docker socket access (root-equivalent host
  # control) so the Settings > Update/Upgrade buttons can pull + recreate
  # containers for you, AND real host root (privileged + pid: host) so
  # Settings > Organization Domain / the Setup Wizard's hardening step can run
  # cyassure-setup.sh (UFW, sshd_config, nginx, certbot, IAP gateway) without
  # you needing SSH access to the host at all. Both are gated together, on
  # this one flag — if you don't want ANY of this container's privilege,
  # comment COMPOSE_PROFILES out in .env and use the SSH command those same
  # UI screens generate as a fallback either way.
  updater:
    image: ghcr.io/cyassure/cy360-updater:${CYASSURE_VERSION:-0.0.86}
    profiles: ["selfupdate"]
    restart: unless-stopped
    privileged: true
    pid: "host"
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      PROJECT_DIR: ${COMPOSE_PROJECT_DIR:-/project}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path on both sides — docker compose resolves relative
      # paths in this file (e.g. backend's env_file: ./.env) against
      # --project-directory client-side; a mismatched container-side path
      # here silently dropped BASE_DOMAIN/CYDATALAKE_ENABLED/FRONTEND_URL
      # from every recreated container (found live, v0.0.20 regression).
      - ${COMPOSE_PROJECT_DIR:-/project}:${COMPOSE_PROJECT_DIR:-/project}
      # Same host path as backend's own /opt/cyassure mount — add-on platform
      # modules (Enterprise Add-ons, e.g. CySOAR) need this to install: that
      # flow runs docker compose against a per-module compose file under
      # /opt/cyassure/modules/<id>/, which only this container can do (it's
      # the only one with docker.sock).
      - /opt/cyassure:/opt/cyassure

volumes:
  cy360_db_data:
  cy360_redis_data:
  cy360_redpanda_data:
  cy360_clickhouse_data:
  cy360_cydatalake_archive:
